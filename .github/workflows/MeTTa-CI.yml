name: MeTTaLog CI

on:
  push:
    branches: [refactor-metta]
  pull_request:
    branches: [refactor-metta]

jobs:
  mettalog-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # You can keep this if you want pip to match a specific version.
      # Optional: Only if you need a guaranteed Python version before INSTALL.sh
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.3'

      - name: Install Python test dependencies (for scripts/run-tests.py)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyswip janus ansi2html junit2html

      - name: Install SWI-Prolog from PPA
        run: |
          sudo apt-get remove -y swi-prolog* || true
          sudo apt-get update
          sudo apt-add-repository ppa:swi-prolog/stable -y
          sudo apt-get update
          sudo apt-get install -y swi-prolog

      - name: Install MeTTaLog (runs INSTALL.sh)
        run: |
          # Clone into runner home directory
          git clone https://github.com/trueagi-io/metta-wam.git --depth 1 $HOME/metta-wam
          cd $HOME/metta-wam

          # Run installer (assumes it sets up venv and installs bindings)
          chmod +x ./INSTALL.sh
          bash -c "source ./INSTALL.sh --allow-system-modifications"

          # Add install paths to environment
          echo "/home/runner/metta-wam" >> $GITHUB_PATH
          echo "/home/runner/metta-wam/venv/bin" >> $GITHUB_PATH
          echo "SWIPL_BOOT_FLAGS=--no-pce" >> $GITHUB_ENV
          echo "METTALOG_DIR=/home/runner/metta-wam" >> $GITHUB_ENV

      - name: Debug Environment
        run: |
          echo "PATH: $PATH"
          echo "PYTHON: $(which python)"
          /home/runner/metta-wam/venv/bin/python -c "import metta; print('metta imported!')"

      - name: Run MeTTaLog Tests with venv Python
        run: |
          /home/runner/metta-wam/venv/bin/python scripts/run-tests.py
